spring.application.name=residential-parking-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/${DB_NAME:residential_parking}}
spring.datasource.username=${DB_USERNAME:parking_user}
spring.datasource.password=${DB_PASSWORD:local_parking_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
